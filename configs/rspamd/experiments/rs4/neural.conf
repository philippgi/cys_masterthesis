# RS3: Rules + Neural (symbol-based, manual training only)

enabled = true;
servers = "redis:6379";
timeout = 20s;

rules {
  default {
    train {
      max_trains = 1400;
      max_usages = 20;
      learning_rate = 0.01;
      max_iterations = 200;

      autotrain = false;
      learn_mode = "balanced";
      classes_bias = 0.25;
    }

    allow_local = true;

    symbol_spam = "NEURAL_SPAM";
    symbol_ham = "NEURAL_HAM";

    ann_expire = 8640000;
  }
}
